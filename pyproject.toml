[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensight"
version = "0.1.0"
description = "Explainable multimodal deepfake and synthetic media detection (IIUM FYP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "opencv-python>=4.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Deep-learning stack: installed on Colab / GPU machines.
dl = [
  "torch>=2.3",
  "torchvision>=0.18",
  "torchaudio>=2.3",
  "timm>=0.9",
  "soundfile>=0.12",
  "mediapipe>=0.10",
]
app = ["flask>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E731", "B905"]
